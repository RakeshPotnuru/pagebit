<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshot preview | Pagebit</title>
    <link rel="icon" type="image/png" href="icons/icon-32.png" />
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"></span><strong>Pagebit</strong></div>
      <div class="buttons">
        <button type="button" id="download" disabled>Download</button>
        <button type="button" id="copy" disabled>Copy</button>
        <button type="button" id="delete" disabled>Delete</button>
      </div>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite">Loading screenshot...</p>
      <img id="image" alt="Captured screenshot" hidden />
    </main>
    <script src="capture-store.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
