<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagebit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Pagebit</h1>
          <p>Capture exactly what you need.</p>
        </div>
      </header>

      <div class="actions">
        <button type="button" data-mode="element">
          <span class="icon" aria-hidden="true">▣</span>
          <span><strong>Select element</strong><small>Click an element on the page</small></span>
        </button>
        <button type="button" data-mode="visible">
          <span class="icon" aria-hidden="true">▭</span>
          <span><strong>Visible area</strong><small>Capture what is on screen</small></span>
        </button>
        <button type="button" data-mode="full">
          <span class="icon" aria-hidden="true">▤</span>
          <span><strong>Full page</strong><small>Capture the entire page</small></span>
        </button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="hint">Click the extension icon again to cancel.</p>
      <p class="hint">Full-page captures may have seams on scroll-animated sites.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
